# Диагностика и демонстрация healthcheck на Helios (с раннера GitHub).
#   sha пуст  → печатает, какая сборка сейчас отдаётся (код ответа + build-commit)
#   sha задан → запускает scripts/healthcheck.sh с этим хешем (неверный хеш → job красная)
name: helios-probe
on:
  workflow_dispatch:
    inputs:
      sha:
        description: ожидаемый build-commit (пусто — только показать текущий)
        required: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      URL: https://se.ifmo.ru/~${{ vars.HELIOS_USER }}/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {sparse-checkout: scripts}
      - name: Что отдаёт Helios сейчас
        run: |
          curl -sS -m 20 -o page.html -w 'HTTP %{http_code}, %{time_total}s\n' "$URL"
          grep -o 'name="build-commit" content="[0-9a-f]*"' page.html
      - name: Healthcheck с заданным хешем
        if: inputs.sha != ''
        env: { SHA: "${{ inputs.sha }}" }
        run: ./scripts/healthcheck.sh "$URL" "$SHA" 3
