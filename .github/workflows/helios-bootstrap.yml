# ОДНОРАЗОВАЯ настройка Helios (ставит шлюз и deploy-ключ). Пароль живёт во временном секрете
# HELIOS_PASSWORD, который удаляется сразу после запуска. Ключ хоста проверяется по HELIOS_KNOWN_HOSTS.
name: helios-bootstrap
on: workflow_dispatch
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Настройка Helios
        env:
          SSHPASS: ${{ secrets.HELIOS_PASSWORD }}
          KNOWN_HOSTS: ${{ secrets.HELIOS_KNOWN_HOSTS }}
          HELIOS_USER: ${{ vars.HELIOS_USER }}
          PUB: ${{ vars.HELIOS_DEPLOY_PUB }}
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          install -d -m 700 ~/.ssh; printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$PUB" > deploy.pub
          export SSH_CMD='sshpass -e ssh -p 2222 -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no'
          scripts/helios-bootstrap.sh "$HELIOS_USER" deploy.pub
