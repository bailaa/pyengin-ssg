# Публикация на Helios ИТМО (https://se.ifmo.ru/~<user>/) по SSH/rsync с отдельным deploy-ключом.
#   main          → ~/public_html/                     (корень сайта)
#   другие ветки  → ~/public_html/preview/<ветка>/     (preview-сборки)
#   удаление ветки → удаление её preview
#   workflow_dispatch: rollback — вернуть предыдущий (или указанный) релиз
#
# Настройка (Settings → Secrets and variables → Actions):
#   vars.HELIOS_USER          — логин sXXXXXX (не секрет: он и так виден в URL сайта)
#   secrets.HELIOS_SSH_KEY    — приватный ed25519 deploy-ключ (публичный — в ~/.ssh/authorized_keys на Helios)
#   secrets.HELIOS_KNOWN_HOSTS — строки `ssh-keyscan -p 2222 helios.cs.ifmo.ru`, сверенные по отпечатку вручную
name: helios

on:
  push:
    branches: ["**"]
    paths-ignore: ["README.md"]
  delete:
  workflow_dispatch:
    inputs:
      action:
        description: deploy — пересобрать и выложить; rollback — вернуть релиз
        type: choice
        options: [deploy, rollback]
        default: deploy
      release:
        description: "rollback: id релиза (пусто — предыдущий)"
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash          # явный bash = -eo pipefail: ошибка rsync не теряется в конвейере с grep

env:
  HOST: helios.cs.ifmo.ru
  PORT: "2222"

jobs:
  # Вычисляем, куда выкладывать. Ветка → безопасное имя каталога.
  plan:
    runs-on: ubuntu-24.04
    if: vars.HELIOS_USER != ''          # пока Helios не настроен, workflow просто пропускается
    outputs:
      slot: ${{ steps.p.outputs.slot }}
      url: ${{ steps.p.outputs.url }}
      release: ${{ steps.p.outputs.release }}
    steps:
      - id: p
        env:
          REF_NAME: ${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
          USER_: ${{ vars.HELIOS_USER }}
        run: |
          # имя ветки пришло от пользователя — обрабатываем как данные, а не как код
          safe=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-40)
          if [ "$REF_NAME" = main ]; then slot=main; path=""; else slot="preview-$safe"; path="preview/$safe/"; fi
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "url=https://se.ifmo.ru/~$USER_/$path" >> "$GITHUB_OUTPUT"
          echo "release=$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: github.event_name == 'push' || inputs.action == 'deploy'
    runs-on: ubuntu-24.04
    env:
      SITE_URL: ${{ needs.plan.outputs.url }}
      DEPLOY_TARGET: helios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Lint — строгая сборка
        run: uv run mkdocs build --strict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          retention-days: 7

  deploy:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && needs.build.result != 'failure' && needs.build.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:                      # не допускаем двух одновременных выкладок в один слот
      group: helios-${{ needs.plan.outputs.slot }}
      cancel-in-progress: false
    environment:
      name: ${{ needs.plan.outputs.slot == 'main' && 'helios' || 'helios-preview' }}
      url: ${{ needs.plan.outputs.url }}
    env:
      SLOT: ${{ needs.plan.outputs.slot }}
      URL: ${{ needs.plan.outputs.url }}
      RELEASE: ${{ needs.plan.outputs.release }}
      TARGET: ${{ vars.HELIOS_USER }}@helios.cs.ifmo.ru
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {sparse-checkout: scripts}

      - name: SSH — ключ и known_hosts (проверка ключа хоста НЕ отключается)
        env:
          KEY: ${{ secrets.HELIOS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HELIOS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host helios.cs.ifmo.ru
            Port $PORT
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 15
            ConnectTimeout 20
          CFG
          # ключ привязан к ~/ssg/bin/ssg-gate.sh (command= в authorized_keys): shell недоступен,
          # только rsync в ~/ssg/releases/ и подкоманды `ssg ...`
          echo "текущий релиз $SLOT: $(ssh "$TARGET" ssg current "$SLOT")"

      - name: Удалить preview удалённой ветки
        if: github.event_name == 'delete'
        run: ssh "$TARGET" ssg remove "$SLOT"

      - name: Откат
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
        env: { REL: "${{ inputs.release }}" }
        run: |
          ssh "$TARGET" ssg rollback "$SLOT" $REL
          ssh "$TARGET" ssg list "$SLOT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.build.result == 'success'
        with: { name: site, path: site }

      - name: Загрузка релиза (rsync; совпадающие по содержимому файлы — жёсткие ссылки на текущий релиз)
        if: needs.build.result == 'success'
        run: |
          start=$(date +%s)
          cur=$(ssh "$TARGET" ssg current "$SLOT")
          # --checksum: сравнение по содержимому. По умолчанию rsync сравнивает размер+mtime,
          # и --link-dest связывал разные файлы одинаковой длины (см. «Отладка»)
          rsync -rlptzc --delete ${cur:+--link-dest=../$cur} site/ "$TARGET:ssg/releases/$SLOT/$RELEASE/"
          echo "UPLOAD_S=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: Активация релиза
        id: activate
        if: needs.build.result == 'success'
        run: |
          start=$(date +%s)
          ssh "$TARGET" ssg activate "$SLOT" "$RELEASE"
          {
            echo "### Helios: $SLOT → $URL"
            echo "| релиз | загрузка, с | активация, с |"
            echo "|---|---:|---:|"
            echo "| \`$RELEASE\` | $UPLOAD_S | $(( $(date +%s) - start )) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Healthcheck — HTTP 200 и build-commit
        if: needs.build.result == 'success'
        run: |
          set +e
          ./scripts/healthcheck.sh "$URL" "$GITHUB_SHA" 5; rc=$?
          if [ $rc = 2 ]; then
            # se.ifmo.ru может не отвечать зарубежным адресам — тогда проверка выполняется с самого Helios
            echo "::warning::se.ifmo.ru недоступен с раннера, проверка с Helios"
            ssh "$TARGET" ssg check "$URL" "$GITHUB_SHA"; rc=$?
          fi
          exit $rc

      - name: Автооткат main при провале проверки
        # только если новый релиз уже был активирован, иначе «откат» снял бы рабочую версию
        if: failure() && env.SLOT == 'main' && steps.activate.outcome == 'success'
        run: ssh "$TARGET" ssg rollback main
